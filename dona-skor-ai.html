<title>Dona vs Skor AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen video player — 9:16 stage fitted with contain, controls bar under it. Single dark look by choice. */
:root{
  --ink:#0f0b09; --panel:#1b1411; --cream:#fff3e2; --rust:#9a4a24; --orange:#ff7a1a; --muted:#bfae9c;
  --display:"Arial Black",Impact,sans-serif; --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:8px;box-sizing:border-box}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#out{width:270px;height:480px;border-radius:14px;background:#000;display:block;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#bigplay{position:absolute;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;border:3px solid var(--cream);
  background:rgba(15,11,9,.55);color:var(--cream);font-size:40px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#bigplay:focus-visible,.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.btn{font:700 15px/1 var(--ui);color:var(--cream);background:var(--panel);border:1.5px solid #4a3a30;border-radius:999px;padding:11px 16px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1a0d05}
.btn[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.btn:disabled{opacity:.5;cursor:default}
#status{font-size:13px;color:var(--muted);text-align:center;min-height:1.2em;font-variant-numeric:tabular-nums}
#recbadge{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#e8442a;color:#fff;font:800 15px/1 var(--ui);
  padding:9px 14px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#note{font-size:12px;color:var(--muted);text-align:center;max-width:52ch;margin:0 auto;line-height:1.4}
[hidden]{display:none!important}
#recbadge{white-space:nowrap}
@media (prefers-reduced-motion:reduce){#bigplay{transition:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="out" width="1080" height="1920" aria-label="Animasi Dona dan skor kelihatan buatan AI"></canvas>
    <button id="bigplay" aria-label="Putar video">▶️</button>
    <div id="recbadge" hidden>Merekam… 0/30 dtk</div>
  </div>
  <div id="bar">
    <button class="btn primary" id="play">▶️ Putar</button>
    <button class="btn" id="rec">⏺ Rekam &amp; Unduh</button>
    <button class="btn" id="tts" aria-pressed="false">🔊 Narasi</button>
    <button class="btn" id="save" hidden>⬇️ Simpan rekaman</button>
  </div>
  <div id="status">Ketuk ▶️ untuk memutar dengan suara.</div>
  <div id="note">🔊 Narasi memakai suara bawaan perangkat (id-ID), hanya untuk pratinjau dan tidak ikut terekam.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const DUR = 30, W = 1080, H = 1920, TITLE = "skor-ai";
const ORANGE = "#ff7a1a", RED = "#e8442a", OUTLINE = "#2a1612";

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const sstep=(a,b,t)=>{const k=clamp((t-a)/(b-a),0,1);return k*k*(3-2*k);};
const easeIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const easeOut=k=>1-Math.pow(1-k,3);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkCanvas(w,h){const c=document.createElement("canvas");c.width=w;c.height=h;return c;}
function tex(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
/* pop: 0→1.35→1 within 0.35 s */
function pop(t,t0){const k=(t-t0)/0.35;if(k<=0)return 0;if(k>=1)return 1;return k<.55?easeOut(k/.55)*1.35:lerp(1.35,1,easeIO((k-.55)/.45));}

/* ---------- script / captions ---------- */
const LINES=[
 {t0:0.0, t1:3.0, who:"narr", text:"Hari ini, tiba-tiba semua website punya *angka *merah di atasnya."},
 {t0:3.0, t1:6.6, who:"narr", text:"Itu skor *kelihatan *buatan *AI. Bu Sari cuma mau yang skornya paling *rendah."},
 {t0:6.6, t1:9.4, who:"raka", text:"“Punya Dona pasti *seratus *persen. Dia kan pakai AI terus.”"},
 {t0:9.4, t1:11.4,who:"dona", text:"“Santai. *Lihat *aja.”"},
 {t0:11.4,t1:15.4,who:"narr", text:"Hasilnya: Raka *dua *belas persen. Dona… *sembilan *puluh *empat."},
 {t0:15.4,t1:20.6,who:"narr", text:"Tapi Dona ganti tiga hal: *foto *asli, kalimatnya *sendiri, dan satu *lelucon."},
 {t0:20.6,t1:26.2,who:"dona", text:"“AI itu kayak *nasi *goreng *hotel: enak, tapi rasanya sama di mana-mana. *Bumbunya harus dari kamu.”"},
 {t0:26.2,t1:30.0,who:"narr", text:"Terus Raka iseng ngecek skor *dirinya *sendiri… dan ternyata…"}
];
LINES.forEach(L=>{
  const raw=L.text.split(/\s+/);
  L.words=raw.map(w=>({hot:w.startsWith("*"),w:w.replace(/^\*/,"").toUpperCase()}));
  // weight words by length so long words stay on screen a bit longer
  const span=(L.t1-L.t0)*0.92, wts=L.words.map(o=>2+o.w.length), sum=wts.reduce((a,b)=>a+b,0);
  let acc=L.t0; L.words.forEach((o,i)=>{o.t=acc;acc+=span*wts[i]/sum;});
});
function talking(who,t){for(const L of LINES){if(L.who===who&&t>=L.t0&&t<L.t1-0.25)return true;}return false;}

/* ---------- renderer ---------- */
const out=document.getElementById("out"), og=out.getContext("2d");
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(1);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.9;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
let RS=1; // render scale (preview may be lower, recording = 1)
function setRenderScale(s){RS=s;renderer.setSize(Math.round(W*s),Math.round(H*s),false);}
function previewScale(){const r=out.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);return clamp((r.height*dpr)/H,0.45,1);}

const scene=new THREE.Scene();
scene.background=new THREE.Color("#1a2a2a");
scene.fog=new THREE.Fog("#2a2622",9,22);
const camera=new THREE.PerspectiveCamera(48,W/H,0.05,60);

/* lights */
const hemi=new THREE.HemisphereLight("#9fb4e0","#5a3a24",0.42);scene.add(hemi);
const amb=new THREE.AmbientLight("#ffe7cc",0.12);scene.add(amb);
const sun=new THREE.DirectionalLight("#ffd29a",1.55);
sun.position.set(-6.5,5.2,2.6);sun.target.position.set(0,0.6,-1);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-3,near:1,far:20});
sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.02;sun.shadow.radius=4;
scene.add(sun,sun.target);
const fill=new THREE.PointLight("#ffb070",0.35,7,2);fill.position.set(0.5,2.6,1.6);scene.add(fill);

/* ---------- materials & procedural textures ---------- */
const std=(c,r=0.7,extra={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:0},extra));
function woodTex(){const c=mkCanvas(512,512),g=c.getContext("2d"),R=mulberry32(7);
  const rows=8,h=512/rows;
  for(let i=0;i<rows;i++){const base=[150+R()*25,95+R()*18,58+R()*12];
    let x=-(R()*300);
    while(x<512){const len=180+R()*220;
      g.fillStyle=`rgb(${base[0]+R()*14-7|0},${base[1]+R()*10-5|0},${base[2]+R()*8-4|0})`;g.fillRect(x,i*h,len,h);
      g.globalAlpha=.12;for(let k=0;k<6;k++){g.fillStyle=R()<.5?"#3b2010":"#f0c08a";g.fillRect(x,i*h+R()*h,len,1+R()*2);}g.globalAlpha=1;
      g.fillStyle="rgba(40,20,10,.55)";g.fillRect(x,i*h,2,h);x+=len;}
    g.fillStyle="rgba(40,20,10,.6)";g.fillRect(0,i*h,512,2);}
  const t=tex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,4);return t;}
function knitTex(base,line,bandColor){const c=mkCanvas(256,128),g=c.getContext("2d");
  g.fillStyle=base;g.fillRect(0,0,256,128);
  for(let x=0;x<256;x+=6){g.fillStyle=line;g.fillRect(x,0,2,128);}
  for(let y=0;y<128;y+=5){g.fillStyle="rgba(0,0,0,.08)";g.fillRect(0,y,256,1);}
  if(bandColor){ // cream tee visible in the open front (front = u 0.5 after rotating lathe by PI)
    g.fillStyle=bandColor;g.fillRect(104,0,48,128);
    g.fillStyle="#6e3218";g.fillRect(100,0,5,128);g.fillRect(151,0,5,128);
    g.fillStyle="#d9c3a5";g.beginPath();g.arc(128,0,18,0,Math.PI);g.fill();
  }
  return tex(c);}
function stripeTex(a,b){const c=mkCanvas(128,128),g=c.getContext("2d");g.fillStyle=a;g.fillRect(0,0,128,128);g.fillStyle=b;for(let y=0;y<128;y+=16)g.fillRect(0,y,128,7);return tex(c);}
function plaidTex(a,b,c2){const c=mkCanvas(128,128),g=c.getContext("2d");g.fillStyle=a;g.fillRect(0,0,128,128);g.globalAlpha=.55;g.fillStyle=b;
  for(let i=0;i<128;i+=32){g.fillRect(i,0,12,128);g.fillRect(0,i,128,12);}g.globalAlpha=.8;g.fillStyle=c2;for(let i=0;i<128;i+=32){g.fillRect(i+20,0,2,128);g.fillRect(0,i+20,128,2);}g.globalAlpha=1;return tex(c);}
function polkaTex(a,b){const c=mkCanvas(256,128),g=c.getContext("2d");g.fillStyle=a;g.fillRect(0,0,256,128);g.fillStyle=b;
  for(let y=0;y<128;y+=22)for(let x=(y/22%2)*11;x<256;x+=22){g.beginPath();g.arc(x,y+6,4.5,0,7);g.fill();}return tex(c);}

/* ---------- faces (shared textures per expression) ---------- */
const FACE_W=512,FACE_H=256;
function drawFace(kind,blink){
  const c=mkCanvas(FACE_W,FACE_H),g=c.getContext("2d");g.clearRect(0,0,FACE_W,FACE_H);
  const cx=256,ey=110,dx=34;g.fillStyle="#120806";g.strokeStyle="#120806";g.lineCap="round";g.lineJoin="round";
  const eyeOval=(x,y,rx,ry)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();};
  const lid=(x,y,w,yy)=>{g.lineWidth=5;g.beginPath();g.moveTo(x-w,yy);g.lineTo(x+w,yy);g.stroke();};
  if(blink && kind!=="grin"){g.lineWidth=6;[-1,1].forEach(s=>{g.beginPath();g.moveTo(cx+s*dx-12,ey+4);g.lineTo(cx+s*dx+12,ey+4);g.stroke();});}
  else if(kind==="calm"||kind==="talk"){[-1,1].forEach(s=>{eyeOval(cx+s*dx,ey+4,8,13);g.fillStyle="#fff";g.fillRect(cx+s*dx-12,ey-14,24,11);g.fillStyle="#120806";lid(cx+s*dx,0,13,ey-3);});}
  else if(kind==="smug"){[-1,1].forEach(s=>{eyeOval(cx+s*dx,ey+6,8,11);g.fillStyle="#fff";g.fillRect(cx+s*dx-12,ey-10,24,12);g.fillStyle="#120806";g.lineWidth=5;g.beginPath();g.moveTo(cx+s*dx-13,ey+1+(s>0?-2:2));g.lineTo(cx+s*dx+13,ey+1+(s>0?2:-2));g.stroke();});}
  else if(kind==="wide"||kind==="pale"){[-1,1].forEach(s=>{g.beginPath();g.arc(cx+s*(dx+4),ey,17,0,7);g.fill();g.fillStyle="#fff";g.beginPath();g.arc(cx+s*(dx+4)-5,ey-6,5,0,7);g.fill();g.fillStyle="#120806";});}
  else if(kind==="grin"){g.lineWidth=7;[-1,1].forEach(s=>{g.beginPath();g.arc(cx+s*dx,ey+8,13,Math.PI*1.1,Math.PI*1.9);g.stroke();});}
  // mouths
  const my=170;g.lineWidth=6;
  if(kind==="calm"){g.beginPath();g.arc(cx,my+14,11,Math.PI*1.2,Math.PI*1.8);g.stroke();}
  else if(kind==="talk"){g.beginPath();g.ellipse(cx,my+2,13,11,0,0,7);g.fill();g.fillStyle="#d2604a";g.beginPath();g.ellipse(cx,my+7,8,4,0,0,7);g.fill();}
  else if(kind==="wide"){g.beginPath();g.ellipse(cx,my+4,13,17,0,0,7);g.fill();}
  else if(kind==="pale"){g.beginPath();for(let i=0;i<=6;i++){const x=cx-24+i*8,y=my+(i%2?-5:5);i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();
    g.fillStyle="#6fc3ff";g.strokeStyle="#1a4a7a";g.lineWidth=3;g.beginPath();g.moveTo(cx+88,ey-40);g.quadraticCurveTo(cx+104,ey-6,cx+88,ey+2);g.quadraticCurveTo(cx+72,ey-6,cx+88,ey-40);g.fill();g.stroke();
    g.fillStyle="rgba(120,170,255,.28)";g.fillRect(cx-70,ey-60,140,28);}
  else if(kind==="smug"){g.beginPath();g.moveTo(cx-22,my+2);g.quadraticCurveTo(cx+4,my+14,cx+26,my-8);g.stroke();}
  else if(kind==="grin"){g.beginPath();g.moveTo(cx-34,my-6);g.quadraticCurveTo(cx,my+40,cx+34,my-6);g.closePath();g.fill();g.fillStyle="#fff";g.fillRect(cx-24,my-4,48,8);}
  // soft cheeks
  if(kind==="grin"||kind==="smug"){g.fillStyle="rgba(255,120,100,.22)";[-1,1].forEach(s=>{g.beginPath();g.ellipse(cx+s*70,ey+40,16,9,0,0,7);g.fill();});}
  const t=tex(c);return t;}
const FACES={};["calm","talk","wide","pale","smug","grin"].forEach(k=>{FACES[k]=drawFace(k,false);});
FACES.blink=drawFace("calm",true);

/* ---------- room ---------- */
const STATIC=[];
function add(mesh,cast=true,recv=true){mesh.castShadow=cast;mesh.receiveShadow=recv;scene.add(mesh);STATIC.push(mesh);return mesh;}
function box(w,h,d,mat,x,y,z,ry=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.y=ry;return add(m);}
function cyl(rt,rb,h,mat,x,y,z,seg=20){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);return add(m);}

const wood=woodTex();
const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),std("#ffffff",0.75,{map:wood}));floor.rotation.x=-Math.PI/2;floor.position.set(0,0,1);add(floor,false,true);
const tealDark=std("#1d4e4b",0.8),teal=std("#256260",0.8),cream=std("#efe0c4",0.8),trim=std("#f6ead4",0.65);
box(10,1.1,0.12,tealDark,0,0.55,-3.06);         // wainscot
box(10,2.3,0.1,teal,0,2.25,-3.1);               // back wall
box(10,0.06,0.16,trim,0,1.12,-3.0);             // chair rail
box(0.1,3.4,8,cream,-3.1,1.7,0.6);             // left wall
box(0.12,1.1,8,tealDark,-3.02,0.55,0.6);
box(0.16,0.06,8,trim,-2.98,1.12,0.6);
box(0.1,3.4,8,cream,3.1,1.7,0.6);              // right wall
box(0.12,1.1,8,tealDark,3.02,0.55,0.6);
box(0.16,0.06,8,trim,2.98,1.12,0.6);
// window on the left wall
const skyC=mkCanvas(64,128),sg=skyC.getContext("2d"),grd=sg.createLinearGradient(0,0,0,128);grd.addColorStop(0,"#ffe2a8");grd.addColorStop(.6,"#ffc27a");grd.addColorStop(1,"#f39a5a");sg.fillStyle=grd;sg.fillRect(0,0,64,128);
const sky=new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.5),new THREE.MeshBasicMaterial({map:tex(skyC),toneMapped:false}));sky.rotation.y=Math.PI/2;sky.position.set(-3.04,1.85,-1.1);add(sky,false,false);
const frameM=std("#f3e6cf",0.6);
[[0,0.78,1.86,0.08],[0,-0.78,1.86,0.08]].forEach(([dz,dy,len,th])=>box(0.1,th,len,frameM,-3.0,1.85+dy,-1.1+dz));
[[-0.89],[0.89],[0]].forEach(([dz])=>box(0.1,1.6,0.07,frameM,-3.0,1.85,-1.1+dz));
box(0.1,0.06,1.8,frameM,-3.0,1.85,-1.1);
box(0.3,0.06,1.95,frameM,-2.92,1.04,-1.1); // sill
// sun shafts (additive planes)
const shaftC=mkCanvas(64,256),shg=shaftC.getContext("2d"),sgrd=shg.createLinearGradient(0,0,0,256);sgrd.addColorStop(0,"rgba(255,214,150,0.55)");sgrd.addColorStop(1,"rgba(255,214,150,0)");shg.fillStyle=sgrd;shg.fillRect(0,0,64,256);
const hg=shg.createLinearGradient(0,0,64,0);hg.addColorStop(0,"rgba(0,0,0,1)");hg.addColorStop(.2,"rgba(0,0,0,0)");hg.addColorStop(.8,"rgba(0,0,0,0)");hg.addColorStop(1,"rgba(0,0,0,1)");shg.globalCompositeOperation="destination-out";shg.fillStyle=hg;shg.fillRect(0,0,64,256);
const shaftMat=new THREE.MeshBasicMaterial({map:tex(shaftC),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,opacity:0.5,toneMapped:false});
const shafts=[];
[[-1.55,0.5],[-1.1,0.42],[-0.65,0.36]].forEach(([z,o],i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(0.42,4.4),shaftMat.clone());m.material.opacity=o;
  m.position.set(-1.25,1.25,z+0.15);m.rotation.set(0,0.05,0);m.rotation.z=-1.02;m.rotateY(0.0);add(m,false,false);shafts.push(m);});
// floor sun patch
const patchC=mkCanvas(128,128),pg=patchC.getContext("2d");const pgr=pg.createRadialGradient(64,64,4,64,64,64);pgr.addColorStop(0,"rgba(255,200,120,.55)");pgr.addColorStop(1,"rgba(255,200,120,0)");pg.fillStyle=pgr;pg.fillRect(0,0,128,128);
const patch=new THREE.Mesh(new THREE.PlaneGeometry(2.8,1.6),new THREE.MeshBasicMaterial({map:tex(patchC),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));
patch.rotation.x=-Math.PI/2;patch.position.set(-0.6,0.006,-0.9);add(patch,false,false);

// desks
const deskTop=std("#8a5a36",0.62),deskLeg=std("#2b211c",0.6);
function desk(x,z){box(1.25,0.05,0.66,deskTop,x,0.72,z);[[-.57,-.28],[.57,-.28],[-.57,.28],[.57,.28]].forEach(([a,b])=>box(0.05,0.7,0.05,deskLeg,x+a,0.35,z+b));}
desk(-0.85,-0.62);desk(0.85,-0.62);
// keyboards
function keyTex(){const c=mkCanvas(256,96),g=c.getContext("2d");g.fillStyle="#3a3431";g.fillRect(0,0,256,96);g.fillStyle="#e9e1d6";for(let r=0;r<4;r++)for(let k=0;k<12;k++)rr(g,6+k*20.6,6+r*22,17,18,3),g.fill();return tex(c);}
const kbMat=[std("#2c2725"),std("#2c2725"),std("#ffffff",0.7,{map:keyTex()}),std("#2c2725"),std("#2c2725"),std("#2c2725")];
function keyboard(x,z){const m=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.025,0.15),kbMat);m.position.set(x,0.757,z);add(m);}
keyboard(-1.0,-0.82);keyboard(1.0,-0.82);
// monitors with canvas screens
function screenCanvas(){return mkCanvas(512,320);}
const monitors={};
function monitor(name,x,z,ry){const g=new THREE.Group();g.position.set(x,0.745,z);g.rotation.y=ry;
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.66,0.42,0.04),std("#1d1a19",0.5));body.position.y=0.42;
  const stand=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.2,0.04),std("#2a2523",0.5));stand.position.set(0,0.12,-0.02);

  if(pn==="point"){const k=sstep(0,0.25,pt);Hn[0]=V(lerp(-0.27,-0.55,k),lerp(0.48,0.98,k),lerp(0.04,0.3,k));E[0]=V(-0.38,0.86,0.12);}
  if(pn==="pointL"){const k=sstep(0,0.25,pt);Hn[0]=V(lerp(-0.27,-0.5,k),lerp(0.48,1.0,k),lerp(0.04,0.35,k));E[0]=V(-0.36,0.86,0.15);}

  // legs
  for(let i=0;i<2;i++){const s=i?1:-1,hip=V(s*0.09,0.47+breathe*0.3+jump*0.9,0);
    let fz=0.04,fy=0.04+jump*0.7,kz=0.05;

const tmpA=new THREE.Vector3(),tmpB=new THREE.Vector3();
function shotPose(s,k){const pos=V(...s[2]).lerp(V(...s[5]),k),look=V(...s[3]).lerp(V(...s[6]),k);let fov=lerp(s[4],s[7],k);
  if(s[8].follow){const r=CHARS[s[8].follow].root.position;look.set(r.x,s[8].fy||1,r.z);}
  if(s[8].dolly){ // dolly zoom: camera moves in while fov widens, subject keeps its size
    const d0=V(...s[2]).distanceTo(V(...s[3])),d=pos.distanceTo(look),f0=s[4];fov=2*Math.atan(Math.tan(f0*Math.PI/360)*d0/d)*180/Math.PI;}
  return {pos,look,fov};}
function cameraAt(t){
  let i=SHOTS.findIndex(s=>t>=s[0]&&t<s[1]);if(i<0)i=SHOTS.length-1;const s=SHOTS[i];
  const k=easeIO(clamp((t-s[0])/(s[1]-s[0]),0,1));
  let P=shotPose(s,k);
  // whip pan: last 0.3 s of a whipOut shot swings fast toward the next shot's start
  if(s[8].whipOut&&t>s[1]-0.3){const n=SHOTS[i+1],q=easeIO((t-(s[1]-0.3))/0.3),N=shotPose(n,0);
    P={pos:P.pos.clone().lerp(N.pos,q*0.5),look:P.look.clone().lerp(N.look,q*0.7),fov:P.fov};}
  if(s[8].whipIn&&t<s[0]+0.3){const pr=SHOTS[i-1],q=easeIO((t-s[0])/0.3),Pp=shotPose(pr,1);
    P={pos:Pp.pos.clone().lerp(P.pos,0.5+q*0.5),look:Pp.look.clone().lerp(P.look,0.7+q*0.3),fov:P.fov};}
  // subtle handheld drift (deterministic)
  P.pos.x+=Math.sin(t*1.3)*0.012;P.pos.y+=Math.sin(t*1.7+1)*0.01;
  camera.position.copy(P.pos);camera.fov=P.fov;camera.updateProjectionMatrix();camera.lookAt(P.look);
  return i;}

/* ---------- badge timeline ---------- */
function badgeAt(b,t,tPop,pos,label,col,size){
  if(t<tPop){b.s.visible=false;return;}
  const sc=pop(t,tPop);b.s.visible=sc>0.01;drawBadge(b,label,col);
  b.s.position.set(pos[0],pos[1]+Math.sin(t*2.4)*0.015,pos[2]);b.s.scale.set(size*sc,size*sc*160/384,1);}
function countTo(t,t0,t1,a,b){return Math.round(lerp(a,b,easeOut(clamp((t-t0)/(t1-t0),0,1))));}
function updateBadges(t){
  if(t>=26.2)badges.lap.s.visible=false;else badgeAt(badges.lap,t,0.25,[1.85,1.3,-2.2],countTo(t,0.3,0.9,0,87)+"%",RED,0.5);
  let rl="?";if(t>=11.7)rl=countTo(t,11.7,12.2,0,12)+"%";
  badgeAt(badges.raka,t,0.6,[0.55,1.5,-0.6],rl,RED,0.46);
  let dl="?",dc=RED;if(t>=12.4)dl=countTo(t,12.4,13.3,0,94)+"%";
  if(t>=15.8){dl=Math.round(lerp(94,6,easeIO(clamp((t-15.8)/3.8,0,1))))+"%";}
  if(t>=19.6)dc=ORANGE;
  badgeAt(badges.dona,t,0.95,[-0.55,1.5,-0.6],dl,dc,0.46);
  if(t>=19.6){const k=pop(t,19.6);const q=0.46*(1+0.25*Math.max(0,1-(t-19.6)*2.5))*k;badges.dona.s.scale.set(q,q*160/384,1);}
  if(t>=12.4&&t<15.8){const pulse=1+Math.max(0,Math.sin((t-12.4)*16))*0.06;badges.dona.s.scale.multiplyScalar(pulse);}
  const headY=1.62;let hl=Math.min(99,Math.floor(Math.max(0,t-27.05)*38))+"%";
  badgeAt(badges.head,t,27.0,[1.0,headY,-1.2],hl,RED,0.42);
}

const vig=mkCanvas(W,H);{const g=vig.getContext("2d"),gr=g.createRadialGradient(W/2,H*0.45,H*0.25,W/2,H*0.5,H*0.78);gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(1,"rgba(10,5,3,.62)");g.fillStyle=gr;g.fillRect(0,0,W,H);}
const grain=mkCanvas(256,256);{const g=grain.getContext("2d"),id=g.createImageData(256,256),R=mulberry32(42);for(let i=0;i<id.data.length;i+=4){const v=R()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=22;}g.putImageData(id,0,0);}
const FONT_CAP='"Arial Black", Impact, sans-serif';
function drawCaption(g,t){
  const L=LINES.find(l=>t>=l.t0&&t<l.t1);if(!L)return;
  const shown=L.words.filter(w=>t>=w.t);if(!shown.length)return;
  const size=74;g.font=`900 ${size}px ${FONT_CAP}`;g.textAlign="left";g.textBaseline="alphabetic";
  const maxW=W-140,space=g.measureText(" ").width;
  // wrap all words of the line (stable layout), draw only the ones spoken
  const rows=[[]];let rowW=0;L.words.forEach(w=>{const ww=g.measureText(w.w).width;if(rowW+ww>maxW&&rows[rows.length-1].length){rows.push([]);rowW=0;}rows[rows.length-1].push({w,ww});rowW+=ww+space;});
  const lh=size*1.12,baseY=H*0.70-(rows.length-1)*lh/2;
  rows.forEach((row,ri)=>{const total=row.reduce((a,o)=>a+o.ww,0)+space*(row.length-1);let x=(W-total)/2;const y=baseY+ri*lh;
    row.forEach(o=>{if(t>=o.w.t){const k=clamp((t-o.w.t)/0.12,0,1),s=lerp(1.25,1,easeOut(k));
        g.save();g.translate(x+o.ww/2,y-size*0.35);g.scale(s,s);g.translate(-(x+o.ww/2),-(y-size*0.35));
        g.lineJoin="round";g.lineWidth=16;g.strokeStyle="#0b0604";g.strokeText(o.w.w,x,y);
        g.fillStyle=o.w.hot?ORANGE:"#ffffff";g.fillText(o.w.w,x,y);g.restore();}
      x+=o.ww+space;});});
  // speaker tag
  if(L.who!=="narr"){const name=L.who==="dona"?"DONA":"RAKA";g.font=`900 34px ${FONT_CAP}`;const tw=g.measureText(name).width;const x=(W-tw)/2-22,y=baseY-size-30;
    g.fillStyle=L.who==="dona"?"#9a4a24":"#d8352a";rr(g,x,y-34,tw+44,48,24);g.fill();g.fillStyle="#fff";g.fillText(name,x+22,y+2);}
}
function composite(t){
  og.drawImage(renderer.domElement,0,0,W,H);
  og.drawImage(vig,0,0);
  // grain, deterministic offset per frame
  const f=Math.floor(t*24),ox=(f*97)%256,oy=(f*57)%256;og.save();og.globalCompositeOperation="overlay";og.globalAlpha=0.5;
  for(let y=-oy;y<H;y+=256)for(let x=-ox;x<W;x+=256)og.drawImage(grain,x,y);og.restore();
  // whip blur streaks
  const wk=whipAmount(t);if(wk>0){og.save();og.globalAlpha=0.35*wk;for(let i=1;i<5;i++)og.drawImage(out,i*18*wk,0);og.restore();}
  drawCaption(og,t);
  if(t>=DUR-1.5){const a=clamp((t-(DUR-1.5))/0.3,0,1);og.save();og.globalAlpha=a;og.font=`900 40px ${FONT_CAP}`;og.textAlign="center";
    og.lineWidth=8;og.strokeStyle="#0b0604";og.strokeText("makewithdona",W/2,H-110);og.fillStyle="#fff3e2";og.fillText("makewithdona",W/2,H-110);
    og.fillStyle=ORANGE;og.fillRect(W/2-60,H-92,120,6);og.restore();}
}
function whipAmount(t){let a=0;for(const w of WHIPS){const d=Math.abs(t-(w+0.3));if(d<0.3)a=Math.max(a,1-d/0.3);}return a;}

/* ---------- frame(t) : deterministic ---------- */
function frame(t){
  t=clamp(t,0,DUR);
  ["dona","raka","sari","bimo"].forEach(n=>poseChar(n,t));
  // screens
  let step=0;if(t>=16.2)step=1;if(t>=17.4)step=2;if(t>=18.6)step=3;
  updateScreen("dona",t<16.2?"generic":"personal",step);updateScreen("raka","generic2",0);updateScreen("lap","generic",0);
  updateBoard(t<20.6?0:Math.min(4,1+Math.floor((t-20.75)/0.6)));
  updateBadges(t);
  // sun shafts shimmer
  shafts.forEach((m,i)=>{m.material.opacity=(0.34+i*-0.05)+Math.sin(t*0.8+i)*0.04;});
  cameraAt(t);
  renderer.render(scene,camera);
  composite(t);
}

function initAudio(){if(AC)return;const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;AC=new Ctx();

  musicBus=AC.createGain();musicBus.gain.value=0.16;musicBus.connect(master);sfxBus=AC.createGain();sfxBus.gain.value=0.7;sfxBus.connect(master);
  try{recDest=AC.createMediaStreamDestination();master.connect(recDest);}catch(e){recDest=null;}
  noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0),R=mulberry32(9);for(let i=0;i<d.length;i++)d[i]=R()*2-1;}
let noiseBuf=null;const live=[];

  click:(t)=>{noise(t,0.025,0.25,"highpass",3500,null,0.7);},
  whoosh:(t)=>{noise(t,0.32,0.35,"bandpass",400,3200,0.8);},
  ding:(t)=>{[1318.5,1975.5,2637].forEach((f,i)=>osc("sine",f,t+i*0.002,1.2-i*0.2,0.28/(i+1),sfxBus));},
  alarm:(t)=>{for(let i=0;i<3;i++)osc("square",620,t+i*0.16,0.1,0.08,sfxBus,560);},
  boing:(t)=>{osc("sine",180,t,0.3,0.35,sfxBus,520);},
  tick:(t)=>{osc("square",1800,t,0.025,0.05,sfxBus);},
  swell:(t)=>{osc("sawtooth",220,t,0.9,0.06,sfxBus,440);}
};
function sfxEvents(){const E=[];
  [0.25,0.6,0.95,27.0].forEach(t=>E.push([t,"pop"]));
  [0.35,1.0,12.9,18.2,27.0].forEach(t=>E.push([t+0.02,"boing"]));
  CUTS.forEach(t=>E.push([t-0.05,"whoosh"]));
  E.push([9.1,"whoosh"]);
  E.push([11.7,"pop"],[12.4,"pop"],[12.9,"alarm"],[19.6,"pop"],[19.65,"ding"]);
  // typing clicks (deterministic)
  const typing=[[0,1.0,9],[3.0,6.6,8],[15.4,19.0,22]];const R=mulberry32(5);
  typing.forEach(([a,b,rate])=>{for(let t=a;t<b;t+=1/rate)E.push([t+R()*0.03,"click"]);});
  for(let t=12.4;t<13.3;t+=0.06)E.push([t,"tick"]);for(let t=15.8;t<19.6;t+=0.09)E.push([t,"tick"]);
  for(let t=27.1;t<30;t+=0.07)E.push([t,"tick"]);
  return E;}
const EVENTS=sfxEvents();
function scheduleMusic(t0,from){ // 112 bpm, I–V–vi–IV in C, bass + soft chords
  const spb=60/112,bar=spb*4,chords=[[48,[60,64,67]],[43,[59,62,67]],[45,[60,64,69]],[41,[60,65,69]]];
  const mf=n=>440*Math.pow(2,(n-69)/12);
  for(let b=0;b*bar<DUR+bar;b++){const [bass,ch]=chords[b%4];
    for(let q=0;q<8;q++){const tt=b*bar+q*spb/2;if(tt<from||tt>DUR-0.3)continue;const at=t0+tt-from;
      osc("triangle",mf(bass+(q%2?12:0)),at,spb*0.45,0.5,musicBus);}
    for(let q=0;q<4;q++){const tt=b*bar+q*spb+spb*0.5;if(tt<from||tt>DUR-0.3)continue;const at=t0+tt-from;ch.forEach(n=>osc("sine",mf(n),at,spb*0.4,0.13,musicBus));}
    const tt=b*bar;if(tt>=from&&tt<DUR-0.3){noise(t0+tt-from,0.08,0.12,"lowpass",900,200,1);}
  }}
function scheduleAll(from){if(!AC)return;const t0=AC.currentTime+0.05;
  scheduleMusic(t0,from);
  EVENTS.forEach(([t,k])=>{if(t>=from&&t<DUR)SFX[k](t0+t-from);});return t0;}
function stopAudio(){while(live.length){const n=live.pop();try{n.stop();}catch(e){}}}

/* ---------- narration preview (speechSynthesis, not recorded) ---------- */
let ttsOn=false,spoken=new Set();
function speakLine(L){try{const u=new SpeechSynthesisUtterance(L.text.replace(/\*/g,"").replace(/[“”]/g,""));u.lang="id-ID";u.rate=1.15;
  const vs=speechSynthesis.getVoices().filter(v=>/^id/i.test(v.lang));if(vs[0])u.voice=vs[0];speechSynthesis.speak(u);}catch(e){}}

/* ---------- playback ---------- */
let playing=false,startClock=0,startT=0,raf=0,recording=false,lastStatusSec=-1;
const btnPlay=document.getElementById("play"),btnRec=document.getElementById("rec"),btnTts=document.getElementById("tts"),btnSave=document.getElementById("save"),
      big=document.getElementById("bigplay"),status=document.getElementById("status"),recBadge=document.getElementById("recbadge");
function now(){return AC?AC.currentTime:performance.now()/1000;}
function play(from=0){
  initAudio();if(AC&&AC.state==="suspended")AC.resume();
  stopAudio();cancelAnimationFrame(raf);try{speechSynthesis.cancel();}catch(e){}
  spoken=new Set();playing=true;startT=from;
  const t0=AC?scheduleAll(from):null;startClock=AC?t0:now();
  big.hidden=true;btnPlay.textContent="↺ Ulang";
  const loop=()=>{const t=startT+Math.max(0,now()-startClock);frame(t);
    if(ttsOn&&!recording){LINES.forEach((L,i)=>{if(t>=L.t0&&!spoken.has(i)){spoken.add(i);speakLine(L);}});}
    if(recording){const s=Math.floor(t);if(s!==lastStatusSec){lastStatusSec=s;recBadge.textContent=`Merekam… ${Math.min(s,DUR)}/${DUR} dtk`;}}
    if(t>=DUR){playing=false;onEnd();return;}
    raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);}
let onEnd=()=>{status.textContent="Selesai. Ketuk ↺ Ulang untuk memutar lagi.";big.hidden=false;big.textContent="↺";big.setAttribute("aria-label","Putar ulang");};

btnPlay.addEventListener("click",()=>{if(recording)return;setRenderScale(previewScale());status.textContent="Memutar…";play(0);});
big.addEventListener("click",()=>btnPlay.click());
btnTts.addEventListener("click",()=>{if(!("speechSynthesis" in window)){status.textContent="Perangkat ini tidak punya speechSynthesis.";return;}
  ttsOn=!ttsOn;btnTts.setAttribute("aria-pressed",String(ttsOn));
  if(ttsOn){try{const u=new SpeechSynthesisUtterance("Narasi aktif");u.lang="id-ID";speechSynthesis.speak(u);}catch(e){}status.textContent="Narasi aktif (pratinjau saja, tidak ikut terekam).";}
  else{try{speechSynthesis.cancel();}catch(e){}status.textContent="Narasi mati.";}});

/* ---------- record & download ---------- */
let lastBlob=null,lastName="";
function pickMime(){if(!window.MediaRecorder)return null;const c=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9","video/webm"];for(const m of c){try{if(MediaRecorder.isTypeSupported(m))return m;}catch(e){}}return "";}
async function saveBlob(blob,name){
  const inViewer=!!(window.claude&&typeof window.claude.use==="function");
  try{if(inViewer){const dl=await window.claude.use("downloads");
      if(dl){await dl.save({filename:name,data:blob});status.textContent=`Tersimpan: ${name}`;return true;}
      status.textContent="Menyimpan file tidak tersedia di tampilan ini. Buka artifact ini di claude.ai lewat browser.";return false;}}
  catch(e){const code=e&&e.code;if(code==="declined"){status.textContent="Penyimpanan dibatalkan. Ketuk ⬇️ Simpan rekaman untuk mencoba lagi.";return false;}
    if(code==="rate_limited"){status.textContent="Tunggu sebentar, lalu ketuk ⬇️ Simpan rekaman.";return false;}}
  // fallback outside the claude.ai viewer (file opened directly in a browser)
  try{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    status.textContent=`Unduhan dimulai: ${name}`;return true;}catch(e){status.textContent="Browser ini menolak unduhan.";return false;}}
btnSave.addEventListener("click",()=>{if(lastBlob)saveBlob(lastBlob,lastName);});
btnRec.addEventListener("click",async()=>{
  if(recording)return;const mime=pickMime();
  if(mime===null||!out.captureStream){status.textContent="Perekaman video tidak didukung di browser ini. Coba Chrome terbaru atau Safari iOS 14.5+.";return;}
  initAudio();if(AC&&AC.state==="suspended"){try{await AC.resume();}catch(e){}}
  try{speechSynthesis.cancel();}catch(e){}
  const vs=out.captureStream(30);const tracks=[...vs.getVideoTracks()];if(recDest)tracks.push(...recDest.stream.getAudioTracks());
  const stream=new MediaStream(tracks);let rec;
  try{rec=mime?new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000}):new MediaRecorder(stream);}catch(e){try{rec=new MediaRecorder(stream);}catch(e2){status.textContent="MediaRecorder gagal dibuat di browser ini.";return;}}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const type=rec.mimeType||mime||"video/webm",ext=/mp4/.test(type)?"mp4":"webm";
  rec.onstop=async()=>{recording=false;document.getElementById("bar").hidden=false;recBadge.hidden=true;
    setRenderScale(previewScale());
    const blob=new Blob(chunks,{type});if(!blob.size){status.textContent="Rekaman kosong. Coba lagi.";return;}
    lastBlob=blob;lastName=`dona-${TITLE}.${ext}`;btnSave.hidden=false;
    status.textContent=`Rekaman siap (${(blob.size/1048576).toFixed(1)} MB, ${ext.toUpperCase()}).`;await saveBlob(blob,lastName);};
  recording=true;lastStatusSec=-1;document.getElementById("bar").hidden=true;recBadge.hidden=false;recBadge.textContent=`Merekam… 0/${DUR} dtk`;
  status.textContent="Merekam dari detik 0. Biarkan layar tetap menyala.";
  setRenderScale(1);frame(0);
  rec.start(500);
  onEnd=()=>{frame(DUR);setTimeout(()=>{try{rec.stop();}catch(e){}},250);
    onEnd=()=>{status.textContent="Selesai. Ketuk ↺ Ulang untuk memutar lagi.";big.hidden=false;big.textContent="↺";};};
  play(0);
});

/* ---------- boot ---------- */
function fitStage(){const st=document.getElementById("stage").getBoundingClientRect();let h=st.height,w=h*9/16;if(w>st.width){w=st.width;h=w*16/9;}
  out.style.width=Math.floor(w)+"px";out.style.height=Math.floor(h)+"px";}
fitStage();
setRenderScale(previewScale());
frame(1.25); // poster frame: badges already popped
window.addEventListener("resize",()=>{fitStage();if(!recording){setRenderScale(previewScale());if(!playing)frame(1.25);}});
window.__seek=t=>{setRenderScale(1);frame(t);}; // used for self-checks
})();
</script>
